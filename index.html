<style>
/* Layout: colonna singola pensata per il telefono, barra delle schede in basso, una sola superficie accentata (l'allenamento di oggi). */
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface2:#E3E8EF;--fg:#0F1722;--muted:#586577;--line:#D2D9E2;
  --accent:#2E4BF0;--accent-ink:#FFFFFF;--accent-soft:#E2E7FD;
  --good:#117A5A;--warn:#B3540B;--bad:#BF3328;--cp:#C77D12;--cf:#1F8F82;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1017;--surface:#151C26;--surface2:#1E2733;--fg:#E8EDF3;--muted:#93A0B2;--line:#263140;
    --accent:#8197FF;--accent-ink:#0B1017;--accent-soft:#1D2646;
    --good:#3DD9A4;--warn:#F0A062;--bad:#FF7B70;--cp:#F0B35A;--cf:#5ED0C0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1017;--surface:#151C26;--surface2:#1E2733;--fg:#E8EDF3;--muted:#93A0B2;--line:#263140;
  --accent:#8197FF;--accent-ink:#0B1017;--accent-soft:#1D2646;
  --good:#3DD9A4;--warn:#F0A062;--bad:#FF7B70;--cp:#F0B35A;--cf:#5ED0C0;color-scheme:dark;
}
/* Colore scelto da ciascun profilo: stessa struttura dei temi, solo l'accento cambia */
:root[data-pal="rose"]{--accent:#D6336C;--accent-ink:#FFFFFF;--accent-soft:#FBE3EC}
:root[data-pal="teal"]{--accent:#0E7C86;--accent-ink:#FFFFFF;--accent-soft:#D8F0F2}
:root[data-pal="violet"]{--accent:#7C3AED;--accent-ink:#FFFFFF;--accent-soft:#ECE4FD}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-pal="rose"]{--accent:#FF85AB;--accent-ink:#1B0B13;--accent-soft:#3B1625}
  :root:not([data-theme="light"])[data-pal="teal"]{--accent:#4FD1DC;--accent-ink:#06171A;--accent-soft:#0F2E33}
  :root:not([data-theme="light"])[data-pal="violet"]{--accent:#B79CFF;--accent-ink:#120B22;--accent-soft:#2A1F4A}
}
:root[data-theme="dark"][data-pal="rose"]{--accent:#FF85AB;--accent-ink:#1B0B13;--accent-soft:#3B1625}
:root[data-theme="dark"][data-pal="teal"]{--accent:#4FD1DC;--accent-ink:#06171A;--accent-soft:#0F2E33}
:root[data-theme="dark"][data-pal="violet"]{--accent:#B79CFF;--accent-ink:#120B22;--accent-soft:#2A1F4A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body)}
.app{max-width:640px;margin-inline:auto;padding-block:14px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:2.3rem;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:1.65rem}
h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font:600 .8rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.top>div{min-width:0}
.sync{font-size:.75rem;color:var(--muted);text-align:right}
main{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.note{background:var(--accent-soft);border-color:transparent}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hero .eyebrow{color:inherit;opacity:.85}
.hero h2{font-size:2.2rem}
.hero p{opacity:.92}
.btn{font:600 .95rem var(--f-body);min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.light{background:var(--accent-ink);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn.big{min-height:56px;font-size:1.1rem;width:100%}
.btn:focus-visible,.tab:focus-visible,.row-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-n{font:700 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.big-n small{font:500 .95rem var(--f-body);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro{display:flex;flex-direction:column;gap:5px;min-width:0}
.macro b{font:700 1.1rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.macro span{font-size:.78rem;color:var(--muted)}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;color:var(--fg);font:inherit;cursor:pointer;min-height:48px}
.meal:first-of-type{border-top:0}
.meal .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.meal .mt small{color:var(--muted);font-size:.85rem}
.meal .kc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
[aria-pressed="true"] .check{background:var(--good);border-color:var(--good)}
[aria-pressed="true"] .check::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%;min-width:0}
textarea{padding:10px 12px;min-height:110px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
.inline{display:flex;gap:8px}
.inline .btn{flex:none}
.glasses{display:flex;flex-wrap:wrap;gap:8px}
.glass{width:36px;height:44px;border-radius:6px 6px 12px 12px;border:2px solid var(--line);background:transparent;cursor:pointer;padding:0}
.glass[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.dchips{display:flex;gap:6px}
.dchip{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .9rem var(--f-body);cursor:pointer;padding:0}
.dchip.today{border-color:var(--accent)}
.dchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ing{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.9rem}
.ing span{white-space:nowrap}
.mline{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv b{font-variant-numeric:tabular-nums}
.shop-h{font:600 .8rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;font-size:.72rem;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface)}
.wd b{font:700 .95rem var(--f-display)}
.wd.on{background:var(--accent-soft);border-color:var(--accent)}
.wd.now{outline:2px solid var(--accent);outline-offset:1px}
.wd.ok b{color:var(--good)}
.exrow{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;padding:6px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row-btn{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;font:inherit;color:var(--fg);cursor:pointer;min-height:48px}
.row-btn:first-of-type{border-top:0}
.how{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;font-size:.92rem}
.cd{font:700 5.5rem/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:center}
.target{font:700 2.6rem/1 var(--f-display);color:var(--accent)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;margin:0}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats dt{font-size:.8rem;color:var(--muted)}
.stats dd{margin:0;font:700 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.dot{aspect-ratio:1;border-radius:5px;background:var(--surface2);display:block}
.dot.h{background:var(--accent);opacity:.45}
.dot.f{background:var(--accent)}
.dlab{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.65rem;color:var(--muted);text-align:center}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;padding:4px 0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .t{font:11px var(--f-body);fill:var(--muted)}
.chart .tv{font:700 12px var(--f-body);fill:var(--fg)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);fill-opacity:.12}
.chart .pt{fill:var(--accent)}
.chart .bar-s{fill:var(--accent)}
.chart .tg{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4}
.msg{font-size:.85rem;color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin-inline:auto;display:flex}
.tab{flex:1;min-width:0;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font:600 .72rem var(--f-body);cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
@media (max-width:380px){.macros{gap:8px}h1{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
.tabs{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{align-items:center;margin-bottom:12px}
.who{display:flex;gap:10px;flex:none}
.top h1{font-size:2rem;overflow-wrap:anywhere}
.av{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font:700 1.2rem/1 var(--f-display);cursor:pointer;display:grid;place-items:center;padding:0}
.av.on{outline:2px solid var(--fg);outline-offset:2px}
.av.sm{width:34px;height:34px;font-size:1rem;flex:none;cursor:inherit}
.sync{text-align:left;margin:0 0 12px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:10px;font:inherit;color:var(--fg);cursor:pointer;min-width:0;min-height:56px}
.pbox.on{border-color:var(--accent)}
.pbox .pt{display:flex;flex-direction:column;min-width:0}
.pbox small{color:var(--muted);font-size:.78rem;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .88rem var(--f-body);cursor:pointer;max-width:100%}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.av:focus-visible,.sw:focus-visible,.pbox:focus-visible,.dchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.have{color:var(--good);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero{position:relative;overflow:hidden;background-image:radial-gradient(120% 100% at 100% 0,rgba(255,255,255,.12),rgba(255,255,255,0) 60%)}
.hero>*{position:relative}
.has-bg .card{background:color-mix(in srgb,var(--surface) 90%,transparent)}
.has-bg .tabs{background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:var(--bgimg,none) center/cover no-repeat}
body::after{background:var(--bg);opacity:var(--veil,0)}
input[type=range]{padding:0;accent-color:var(--accent)}
html{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-size:16px}
button,.chip,.tab{touch-action:manipulation;-webkit-user-select:none;user-select:none}
textarea.ft{font-family:var(--f-body);font-size:16px;min-height:76px;resize:vertical}
.drow{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.draft{display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-radius:12px;padding:12px}
.draft input{background:var(--surface)}
.ringrow{display:flex;align-items:center;gap:16px}
.ringrow>div{min-width:0}
.ring{flex:none;width:96px;height:96px}
.ring .tr{stroke:var(--surface2)}
.ring .pg{stroke:var(--accent)}
.ring .pg.over{stroke:var(--warn)}
.ring text{font:700 22px var(--f-display);fill:var(--fg)}
.xrow>.mt{flex:1}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
:root{padding:0}
#scroll{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-top:env(safe-area-inset-top,0px)}
.app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.hero .deco{position:absolute;right:-14px;bottom:-18px;width:132px;height:132px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.16;pointer-events:none}
</style>

function save(){ST.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}syncSoon();}
function setSync(){var t={local:'Dati salvati su questo dispositivo',sync:'Salvataggio…',ok:'Salvato nel tuo account',err:'Salvataggio nell’account non riuscito'}[remote.status];var el=$('sync');if(el)el.textContent=t;}
function syncSoon(){if(!remote.doc)return;remote.dirty=true;clearTimeout(remote.timer);remote.timer=setTimeout(flush,900);remote.status='sync';setSync();}
function flush(){
  if(!remote.doc||remote.busy||!remote.dirty)return;
  remote.busy=true;remote.dirty=false;
  remote.doc.set({payload:JSON.stringify(ST),updatedAt:ST.updatedAt}).then(function(){remote.status=remote.dirty?'sync':'ok';}).catch(function(){remote.status='err';}).then(function(){remote.busy=false;setSync();if(remote.dirty)flush();});
}
function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use('user').then(function(u){return u?u.id():null;}).then(function(id){
      if(!id)return null;
      return window.claude.use('db').then(function(db){
        if(!db)return null;
        var doc=db.collection('data/users/'+id).doc('corpolibero');
        return doc.get().then(function(snap){
          if(snap.exists){
            var d=snap.data()||{};
            if(d.payload&&(d.updatedAt||0)>ST.updatedAt){
              try{var ns=normStore(JSON.parse(d.payload));ns.updatedAt=d.updatedAt;setStore(ns);try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}render();}catch(e){}
            }
          }
          remote.doc=doc;remote.status='ok';
          if(ST.updatedAt>((snap.exists&&snap.data().updatedAt)||0)){remote.dirty=true;flush();}
          setSync();
        });
      });
    }).catch(function(){setSync();});
  }catch(e){}
}

/* ========== calcoli ========== */
function calc(p){
  var bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='M'?5:-161);
  var life={sit:1.25,mid:1.4,act:1.55}[p.life]||1.4;
  var tdee=bmr*(life+p.days*0.025);
  var kcal=p.goal==='cut'?tdee*0.85:p.goal==='bulk'?tdee*1.1:tdee;
  var floor=p.sex==='M'?1500:1200;var floored=kcal<floor;kcal=Math.max(floor,kcal);kcal=Math.round(kcal/10)*10;
  var prot=Math.round(p.weight*(p.goal==='cut'?2:1.8));
  var fat=Math.round(kcal*0.27/9);
  var carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:kcal,prot:prot,fat:fat,carb:carb,water:Math.max(6,Math.round(p.weight*35/250)),floored:floored};
}
var STAPLE={olio:1};
function pn(){return Object.keys(ST.pantry).filter(function(k){return ST.pantry[k];}).length;}
function have(id){return !!ST.pantry[id]||!!STAPLE[id];}
function short(id){return F[id].n.replace(/ \(.*\)/,'');}
function pscore(o){var n=0;o.ing.forEach(function(a){if(have(a[0]))n++;});return n/o.ing.length;}
function missing(o){return o.ing.filter(function(a){return !have(a[0]);}).map(function(a){return short(a[0]);});}
function usePantry(){return ST.mode==='pantry'&&pn()>0;}
function opts(m){return OPT.filter(function(o){return o.m===m&&(S.profile.diet!=='veg'||o.veg);});}
function ranked(m){
  var l=opts(m);if(!usePantry())return l;
  return l.map(function(o,i){return {o:o,s:pscore(o),i:i};}).sort(function(a,b){return b.s-a.s||a.i-b.i;}).map(function(x){return x.o;});
}
function chosen(di,m){
  var l=ranked(m),id=(S.plan[di]||{})[m],o=l.filter(function(x){return x.id===id;})[0];
  if(o)return o;
  var mi=MEALS.map(function(x){return x.k;}).indexOf(m);
  if(usePantry()){
    var best=pscore(l[0]),th=best>=0.999?0.999:Math.max(best-0.2,0);
    var c=l.filter(function(x){return pscore(x)>=th-1e-9;});
    return c[(di+mi)%c.length];
  }
  return l[(di+mi)%l.length];
}
function mealCalc(o,target){
  var base=0;o.ing.forEach(function(a){base+=F[a[0]].k*a[1]/100;});
  var fc=clamp(target/base,0.6,1.8);
  var ing=o.ing.map(function(a){var q=a[1]*fc;q=a[0]==='uova'?Math.max(1,Math.round(q/60))*60:Math.max(5,Math.round(q/5)*5);return [a[0],q];});
  var t={k:0,p:0,c:0,f:0};
  ing.forEach(function(a){var x=F[a[0]];t.k+=x.k*a[1]/100;t.p+=x.p*a[1]/100;t.c+=x.c*a[1]/100;t.f+=x.f*a[1]/100;});
  return {ing:ing,t:t};
}
function dayPlan(di){
  var C=calc(S.profile);var t={k:0,p:0,c:0,f:0};
  var items=MEALS.map(function(M){var o=chosen(di,M.k);var r=mealCalc(o,C.kcal*M.share);t.k+=r.t.k;t.p+=r.t.p;t.c+=r.t.c;t.f+=r.t.f;return {M:M,o:o,ing:r.ing,t:r.t};});
  return {items:items,t:t,C:C};
}
function qty(id,q){if(id==='uova'){var n=q/60;return n+' '+(n===1?'uovo':'uova');}return q+' g';}
function getLog(ds){return S.log[ds]||{eaten:{},extras:[],water:0};}
function ensureLog(ds){if(!S.log[ds])S.log[ds]={eaten:{},extras:[],water:0};return S.log[ds];}
function eatenTotals(ds,di){
  var lg=getLog(ds),dp=dayPlan(di);var k=0,p=0,c=0,f=0;
  dp.items.forEach(function(it){if(lg.eaten[it.M.k]){k+=it.t.k;p+=it.t.p;c+=it.t.c;f+=it.t.f;}});
  lg.extras.forEach(function(x){k+=x.k;p+=x.p||0;c+=x.c||0;f+=x.f||0;});
  return {k:k,p:p,c:c,f:f};
}
function mealsEaten(ds){var lg=S.log[ds];return lg?Object.keys(lg.eaten).filter(function(k){return lg.eaten[k];}).length:0;}
function active(ds){return S.sessions.some(function(x){return x.d===ds;})||mealsEaten(ds)>=3;}
function streak(){var d=new Date(),n=0;if(!active(iso(d)))d=addDays(d,-1);while(active(iso(d))&&n<400){n++;d=addDays(d,-1);}return n;}
function weekPhase(){var days=Math.round((parseISO(iso(new Date()))-parseISO(S.profile.start))/864e5);return Math.max(0,Math.floor(days/7))%4;}
function weekNo(){var days=Math.round((parseISO(iso(new Date()))-parseISO(S.profile.start))/864e5);return Math.max(0,Math.floor(days/7))+1;}
function prescribe(e,id){
  var L=LEVELS[S.profile.level],ph=weekPhase();
  var sets=L.sets,reps=L.reps+(ph<3?2*ph:2),time=L.time+(ph<3?5*ph:0);
  if(ph===3)sets=Math.max(2,sets-1);
  if(id==='burpee')reps=Math.max(5,Math.round(reps*0.6));
  return {sets:sets,reps:reps,time:time,rest:L.rest};
}
function sessionFor(di){var n=S.profile.days,i=WD_MAP[n].indexOf(di);return i<0?null:SES_FOR[n][i];}
function pick(pool,i){var n=pool.length,w=weekNo()-1+(S.varOff||0)+i;return pool[((w%n)+n)%n];}
function sesIds(sid){return SES[sid].slots.map(function(p,i){return pick(p,i);});}
function buildItems(sid){return sesIds(sid).map(function(id){var e=EX[id],P=prescribe(e,id);return {id:id,e:e,sets:P.sets,reps:P.reps,time:P.time,rest:P.rest};});}
function estMin(sid){
  var s=0;buildItems(sid).forEach(function(it){var w=it.e.t==='r'?it.reps*(it.e.side?2:1)*3.5:it.time*(it.e.side?2:1);s+=it.sets*(w+it.rest);});
  return Math.round(s/60/5)*5+5;
}
function target(it){return it.e.t==='r'?it.reps+' ripetizioni'+(it.e.side?' per lato':''):it.time+' secondi'+(it.e.side?' per lato':'');}
function pres(it){return it.sets+' × '+(it.e.t==='r'?it.reps:it.time+' s');}

/* ========== audio, vibrazione, schermo ========== */
var AC=null,WL=null;
function audioInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d){
  try{if(AC){var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(d||0.12));o.start();o.stop(AC.currentTime+(d||0.12));}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(40);}catch(e){}
}
function wake(){try{navigator.wakeLock.request('screen').then(function(l){WL=l;}).catch(function(){});}catch(e){}}
function unwake(){try{if(WL)WL.release();}catch(e){}WL=null;}

/* ========== allenamento guidato ========== */
var G=null,TI=0;
function startTick(){clearInterval(TI);TI=setInterval(tick,250);}
function stopTick(){clearInterval(TI);TI=0;}
function startSession(sid){audioInit();wake();G={sid:sid,items:buildItems(sid),i:0,set:1,phase:'ready',endAt:0,dur:0,started:Date.now(),quit:false,half:false,lastRem:-1};ui.tab='train';render();toTop();}
function startRest(sec){G.phase='rest';G.dur=sec;G.endAt=Date.now()+sec*1000;G.lastRem=-1;startTick();}
function completeSet(){
  stopTick();
  var it=G.items[G.i];
  if(G.set<it.sets){G.set++;startRest(it.rest);}
  else if(G.i<G.items.length-1){G.i++;G.set=1;startRest(it.rest+15);}
  else{
    G.phase='done';unwake();beep(660,0.3);
    var min=Math.max(1,Math.round((Date.now()-G.started)/60000));
    S.sessions.push({d:iso(new Date()),name:SES[G.sid].n,min:min,ex:G.items.length});save();
  }
  render();
}
function tick(){
  if(!G||(G.phase!=='work'&&G.phase!=='rest')){stopTick();return;}
  var now=Date.now(),rem=Math.ceil((G.endAt-now)/1000);
  var cd=$('cd'),bar=$('cdbar');
  if(rem<0)rem=0;
  if(cd)cd.textContent=rem;
  if(bar)bar.style.width=clamp((G.endAt-now)/(G.dur*1000)*100,0,100)+'%';
  var it=G.items[G.i];
  if(G.phase==='work'&&it.e.side&&!G.half&&now>=G.endAt-G.dur*500){G.half=true;beep(520,0.25);var h=$('hint');if(h)h.textContent='Cambia lato';}
  if(rem<=3&&rem>0&&rem!==G.lastRem){G.lastRem=rem;beep(740,0.08);}
  if(now>=G.endAt){
    stopTick();
    if(G.phase==='work'){beep(880,0.3);completeSet();}
    else{G.phase='ready';beep(880,0.3);render();}
  }
}

function bgOp(){try{var v=parseInt(localStorage.getItem('corpolibero.bgop'),10);return isNaN(v)?40:clamp(v,0,100);}catch(e){return 40;}}
function applyBg(){
  var d=bgGet(ST.cur),r=document.documentElement;
  if(d){r.style.setProperty('--bgimg','url("'+d+'")');r.classList.add('has-bg');}
  else{r.style.removeProperty('--bgimg');r.classList.remove('has-bg');}
  r.style.setProperty('--veil',String(d?0.92-0.62*bgOp()/100:0));
}
function bgMsg(t){var m=$('bgm');if(m)m.textContent=t;}
function loadBg(file){
  if(!file||!/^image\//.test(file.type)){bgMsg('Scegli un file immagine.');return;}
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var url=c.toDataURL('image/jpeg',0.82);
      try{localStorage.setItem(BGK+ST.cur,url);}catch(e){bgMsg('Immagine troppo grande per essere salvata. Provane una più piccola.');return;}
      render();
    };
    im.onerror=function(){bgMsg('Non riesco a leggere questa immagine.');};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function renderHead(){
  var h='';
  ORDER.forEach(function(k){var d=ST.pp[k],on=k===ST.cur;h+='<button class="av'+(on?' on':'')+'" data-act="who" data-v="'+k+'" style="background:'+PAL[d.meta.pal].c+'" aria-pressed="'+on+'" aria-label="Profilo di '+esc(d.meta.name)+'">'+initial(d.meta.name)+'</button>';});
  $('who').innerHTML=h;
}
function render(){
  var n=new Date();
  document.documentElement.setAttribute('data-pal',S.meta.pal);

  renderHead();
  V.innerHTML={today:vToday,diet:vDiet,train:vTrain,prog:vProg,prof:vProf}[ui.tab]();
  setSync();
}

function vGuided(){
  var total=G.items.length,it=G.items[G.i];
  if(G.phase==='done'){
    var min=Math.max(1,Math.round((Date.now()-G.started)/60000));
    return '<div class="card"><div class="eyebrow">Completato</div><h2>'+esc(SES[G.sid].n)+'</h2><p>'+min+' '+(min===1?'minuto':'minuti')+', '+total+' esercizi. Ottimo lavoro.</p><button class="btn primary" data-act="gclose">Chiudi</button></div>';
  }
  var top='<div class="gtop"><span class="eyebrow">Esercizio '+(G.i+1)+' di '+total+'</span><button class="btn ghost sm" data-act="gquit">Esci</button></div>'+barHTML(G.i,total);
  if(G.quit)return '<div class="card">'+top+'<p>Vuoi interrompere l’allenamento? Questa sessione non verrà salvata.</p><div class="row"><button class="btn" data-act="gno">Continua</button><button class="btn primary" data-act="gyes">Interrompi</button></div></div>';

    var rem=Math.max(0,Math.ceil((G.endAt-Date.now())/1000));
    return '<div class="card">'+top+'<div class="eyebrow" style="margin-top:6px">Recupero</div><div class="cd" id="cd">'+rem+'</div><div class="bar"><i id="cdbar" style="width:'+clamp((G.endAt-Date.now())/(G.dur*1000)*100,0,100)+'%"></i></div><p class="muted">Prossima: '+esc(it.e.n)+', serie '+G.set+' di '+it.sets+'</p><div class="row"><button class="btn" data-act="radd">+15 s</button><button class="btn primary" data-act="rskip">Salta recupero</button></div></div>';
  }
  var h='<div class="card">'+top+'<div class="eyebrow" style="margin-top:6px">'+it.e.g+' · serie '+G.set+' di '+it.sets+'</div><h2>'+esc(it.e.n)+'</h2>';
  if(G.phase==='work'){
    var rem2=Math.max(0,Math.ceil((G.endAt-Date.now())/1000));
    h+='<div class="cd" id="cd">'+rem2+'</div><div class="bar"><i id="cdbar" style="width:'+clamp((G.endAt-Date.now())/(G.dur*1000)*100,0,100)+'%"></i></div><p class="muted" id="hint">'+(it.e.side?(G.half?'Cambia lato':'Primo lato'):'Mantieni la posizione')+'</p><button class="btn big" data-act="gdone">Fatto</button>';
  }else{
    h+='<div class="target">'+target(it)+'</div><div class="how"><p>'+esc(it.e.how)+'</p><p><b>Più facile:</b> '+esc(it.e.easy)+'</p><p><b>Più difficile:</b> '+esc(it.e.hard)+'</p></div>';
    h+=it.e.t==='r'?'<button class="btn primary big" data-act="gdone">Serie fatta</button>':'<button class="btn primary big" data-act="gtimer">Avvia timer</button>';
    h+='<button class="btn ghost" data-act="gskip">Salta esercizio</button>';
    if(G.i===0&&G.set===1)h+='<p class="small muted">'+WARM+'</p>';
  }
  return h+'</div>';
}

function weightChart(){
  var w=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1;}).slice(-60);
  if(w.length<2)return '<p class="muted">Registra il peso in almeno due giorni per vedere l’andamento.</p>'+(w.length?'<p><b>'+dec(w[0].kg)+' kg</b> il '+shortDate(w[0].d)+'</p>':'');
  var W=600,H=210,ml=40,mr=14,mt=16,mb=26,pw=W-ml-mr,ph=H-mt-mb;
  var vals=w.map(function(x){return x.kg;}),lo=Math.floor(Math.min.apply(null,vals)-0.5),hi=Math.ceil(Math.max.apply(null,vals)+0.5);
  if(hi-lo<2)hi=lo+2;
  var t0=parseISO(w[0].d).getTime(),t1=parseISO(w[w.length-1].d).getTime();
  var X=function(d){return ml+(t1===t0?pw/2:(parseISO(d).getTime()-t0)/(t1-t0)*pw);};
  var Y=function(v){return mt+ph-(v-lo)/(hi-lo)*ph;};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del peso">';
  [lo,(lo+hi)/2,hi].forEach(function(v){s+='<line class="gl" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="t" x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+dec(v)+'</text>';});
  var pts=w.map(function(x){return X(x.d).toFixed(1)+','+Y(x.kg).toFixed(1);});
  s+='<polygon class="ar" points="'+X(w[0].d).toFixed(1)+','+(mt+ph)+' '+pts.join(' ')+' '+X(w[w.length-1].d).toFixed(1)+','+(mt+ph)+'"/><polyline class="ln" points="'+pts.join(' ')+'"/>';
  var last=w[w.length-1],lx=X(last.d),ly=Y(last.kg);
  s+='<circle class="pt" cx="'+lx+'" cy="'+ly+'" r="4.5"/><text class="tv" x="'+lx+'" y="'+(ly<mt+14?ly+18:ly-9)+'" text-anchor="end">'+dec(last.kg)+' kg</text>';
  s+='<text class="t" x="'+ml+'" y="'+(H-6)+'">'+shortDate(w[0].d)+'</text><text class="t" x="'+(W-mr)+'" y="'+(H-6)+'" text-anchor="end">'+shortDate(last.d)+'</text></svg>';
  return s;
}
function weeksChart(){
  var tg=S.profile.days,mon=addDays(new Date(),-wdx(new Date())),counts=[],labels=[];
  for(var i=7;i>=0;i--){var a=addDays(mon,-7*i),b=addDays(a,6),sa=iso(a),sb=iso(b);counts.push(S.sessions.filter(function(x){return x.d>=sa&&x.d<=sb;}).length);labels.push(a.getDate()+'/'+(a.getMonth()+1));}
  var W=600,H=190,ml=28,mr=10,mt=16,mb=26,pw=W-ml-mr,ph=H-mt-mb,ymax=Math.max.apply(null,counts.concat([tg,1])),step=ymax>8?2:1;
  var Y=function(v){return mt+ph-v/ymax*ph;},slot=pw/8,bw=slot*0.56;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Allenamenti per settimana">';
  for(var v=0;v<=ymax;v+=step)s+='<line class="gl" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="t" x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  counts.forEach(function(c,i){var x=ml+slot*i+(slot-bw)/2,h=c/ymax*ph;if(c>0)s+='<rect class="bar-s" x="'+x+'" y="'+Y(c)+'" width="'+bw+'" height="'+h+'" rx="3"/><text class="tv" x="'+(x+bw/2)+'" y="'+(Y(c)-4)+'" text-anchor="middle">'+c+'</text>';s+='<text class="t" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+labels[i]+'</text>';});
  s+='<line class="tg" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(tg)+'" y2="'+Y(tg)+'"/></svg>';
  return s;
}

function onProfile(){

  var nm=($('p-name').value||'').trim().slice(0,14);if(nm)S.meta.name=nm;
  P.sex=$('p-sex').value;P.age=Math.round(num('p-age',18,90,P.age));P.height=Math.round(num('p-height',120,220,P.height));P.weight=Math.round(num('p-weight',35,250,P.weight)*10)/10;
  P.goal=$('p-goal').value;P.life=$('p-life').value;P.days=+$('p-days').value;P.level=$('p-level').value;P.diet=$('p-diet').value;P.confirmed=true;
  save();$('psum').innerHTML=sumHTML();renderHead();
}
function measHTML(){
  var M=S.meas.slice().sort(function(a,b){return a.d<b.d?-1:1;});
  var h='<div class="card"><div class="eyebrow">Misure del corpo</div>',rows='';
  [['v','Vita'],['f','Fianchi'],['b','Braccio']].forEach(function(r){
    var l=M.filter(function(x){return x[r[0]]>0;});if(!l.length)return;
    var a=l[0][r[0]],b=l[l.length-1][r[0]],d=b-a;
    rows+='<div class="kv"><span>'+r[1]+'</span><b>'+dec(b)+' cm'+(l.length>1?' <small class="muted">('+(d>0?'+':'')+dec(d)+')</small>':'')+'</b></div>';
  });
  h+=rows||'<p class="muted">Registra vita, fianchi e braccio per vedere come cambia il corpo oltre al peso.</p>';
  h+='<div class="grid3"><label>Vita (cm)<input id="m-v" type="number" step="0.1" inputmode="decimal"></label><label>Fianchi (cm)<input id="m-f" type="number" step="0.1" inputmode="decimal"></label><label>Braccio (cm)<input id="m-b" type="number" step="0.1" inputmode="decimal"></label></div>';
  h+='<div><button class="btn" data-act="addm">Salva misure</button></div>';
  if(M.length)h+='<p class="small muted">Ultimo inserimento: '+shortDate(M[M.length-1].d)+'. Tra parentesi la variazione dal primo valore.</p>';
  return h+'</div>';
}

/* ========== azioni ========== */
function readNum(id){var el=$(id);return el?parseFloat(String(el.value).replace(',','.')):NaN;}
var ACT={
 bgoff:function(){try{localStorage.removeItem(BGK+ST.cur);}catch(e){}render();},
 fcalc:function(){
   var el=$('ft'),tx=(el?el.value:ui.txt)||'';ui.txt=tx;
   var fm=$('fm');if(fm)ui.fmeal=fm.value;
   if(!tx.trim()){ui.fmsg='Scrivi prima cosa hai mangiato.';ui.draft=null;render();return;}
   var d=parseFood(tx);
   if(!d.length){ui.fmsg='Non ho capito. Prova con: 2 uova, 60 g di pane.';ui.draft=null;render();return;}
   ui.draft=d;ui.fmsg=d.some(function(x){return x.unk;})?'Per gli alimenti che non conosco scrivi tu le calorie.':'';
   render();
 },
 fdel:function(v){if(!ui.draft)return;ui.draft.splice(+v,1);if(!ui.draft.length)ui.draft=null;render();},
 fcancel:function(){ui.draft=null;ui.fmsg='';render();},
 fadd:function(){
   if(!ui.draft)return;
   var lg=ensureLog(iso(new Date())),meal=ui.fmeal||mealDefault(),n=0;
   ui.draft.forEach(function(it){
     var k=itK(it),m=itM(it);if(!(k>0))return;
     var e={n:(it.fixed||it.unk)?it.n:it.n+' · '+it.g+' g',k:Math.round(k),p:Math.round(m.p*10)/10,c:Math.round(m.c*10)/10,f:Math.round(m.f*10)/10,m:meal};
     lg.extras.push(e);rememberFood(e);n++;
   });
   if(!n){ui.fmsg='Inserisci le calorie per gli alimenti che non conosco.';render();return;}
   ui.draft=null;ui.txt='';ui.fmsg='';save();render();
 },
 frecent:function(i){var r=(S.recent||[])[+i];if(!r)return;ensureLog(iso(new Date())).extras.push(Object.assign({},r,{m:ui.fmeal||mealDefault()}));save();render();},
 gskip:function(){
   if(!G)return;stopTick();G.set=G.items[G.i].sets;completeSet();
   if(G.phase==='rest'){stopTick();G.phase='ready';render();}
 },
 who:function(k){if(!ST.pp[k])return;if(k===ST.cur){ui.tab='prof';render();toTop();return;}stopTick();unwake();G=null;ST.cur=k;S=ST.pp[k];ui.exportTxt='';ui.day=wdx(new Date());save();render();toTop();},
 pal:function(v){if(!PAL[v])return;S.meta.pal=v;save();render();},
 pantry:function(){ui.pantry=!ui.pantry;render();},
 pi:function(id){if(!F[id])return;if(ST.pantry[id])delete ST.pantry[id];else{ST.pantry[id]=1;if(pn()===1)ST.mode='pantry';}save();render();},
 mode:function(v){ST.mode=v==='pantry'?'pantry':'any';save();render();},
 regen:function(){S.plan={};save();render();},
 pclear:function(){ST.pantry={};ST.mode='any';save();render();},
 topantry:function(){ui.tab='diet';ui.pantry=true;ui.day=wdx(new Date());render();toTop();},
 vary:function(){S.varOff=(S.varOff||0)+1;save();render();},
 shopwho:function(v){ui.both=v==='both';render();},
 addm:function(){
   var o={d:iso(new Date())},any=false;
   [['v','m-v'],['f','m-f'],['b','m-b']].forEach(function(r){var v=readNum(r[1]);if(v>=10&&v<=250){o[r[0]]=Math.round(v*10)/10;any=true;}});
   if(!any){$('m-v').focus();return;}
   var prev=S.meas.filter(function(x){return x.d===o.d;})[0];
   if(prev)Object.assign(prev,o);else S.meas.push(o);
   save();render();
 },
 go:function(v){if(G&&v!=='train'){}ui.tab=v;render();toTop();},
 eat:function(m){var lg=ensureLog(iso(new Date()));lg.eaten[m]=!lg.eaten[m];save();render();},
 glass:function(v){var lg=ensureLog(iso(new Date())),n=+v;lg.water=lg.water===n?n-1:n;save();render();},
 addx:function(){var n=($('x-n').value||'').trim().slice(0,40),k=readNum('x-k');if(!(k>0)||k>5000){$('x-k').focus();return;}ensureLog(iso(new Date())).extras.push({n:n||'Extra',k:Math.round(k)});save();render();},
 delx:function(v){ensureLog(iso(new Date())).extras.splice(+v,1);save();render();},
 day:function(v){ui.day=+v;render();},
 swap:function(m){var list=ranked(m),cur=chosen(ui.day,m),next=list[(list.indexOf(cur)+1)%list.length];S.plan[ui.day]=S.plan[ui.day]||{};S.plan[ui.day][m]=next.id;save();render();},
 shop:function(){ui.shop=!ui.shop;render();},
 shopc:function(id){ST.shop[id]=!ST.shop[id];save();render();},
 shopr:function(){ST.shop={};save();render();},
 lib:function(id){ui.lib=ui.lib===id?null:id;render();},
 start:function(sid){startSession(sid);},
 gtimer:function(){audioInit();var it=G.items[G.i];G.phase='work';G.dur=it.time*(it.e.side?2:1);G.endAt=Date.now()+G.dur*1000;G.half=false;G.lastRem=-1;startTick();render();},
 gdone:function(){audioInit();completeSet();},
 rskip:function(){stopTick();G.phase='ready';render();},
 radd:function(){G.endAt+=15000;G.dur+=15;tick();},
 gquit:function(){G.quit=true;render();},
 gno:function(){G.quit=false;render();},
 gyes:function(){stopTick();unwake();G=null;render();},
 gclose:function(){G=null;render();},
 addw:function(v,t){
   var id=t.dataset.for,kg=readNum(id);
   if(!(kg>=30&&kg<=300)){$(id).focus();return;}
   var d=iso(new Date());S.weights=S.weights.filter(function(x){return x.d!==d;});S.weights.push({d:d,kg:Math.round(kg*10)/10});
   S.profile.weight=Math.round(kg*10)/10;save();render();
 },
 delw:function(d){S.weights=S.weights.filter(function(x){return x.d!==d;});var w=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1;});if(w.length)S.profile.weight=w[w.length-1].kg;save();render();},
 'export':function(){ui.exportTxt=JSON.stringify(ST);var t=$('exp');t.value=ui.exportTxt;t.focus();t.select();},
 copy:function(){
   if(!ui.exportTxt)ui.exportTxt=JSON.stringify(ST);var t=$('exp');t.value=ui.exportTxt;t.focus();t.select();
   try{navigator.clipboard.writeText(ui.exportTxt).catch(function(){});}catch(e){}
 },
 impAsk:function(){
   var m=$('impM');m.textContent='';
   try{var o=JSON.parse($('imp').value);if(!o||typeof o!=='object'||!(o.profile||o.pp))throw 0;$('impC').hidden=false;}catch(e){m.textContent='I dati incollati non sono validi.';$('impC').hidden=true;}
 },
 impYes:function(){try{setStore(normStore(JSON.parse($('imp').value)));save();ui.exportTxt='';render();}catch(e){$('impM').textContent='I dati incollati non sono validi.';}},
 resetAsk:function(){$('resC').hidden=false;},
 resetYes:function(){setStore(blankStore());G=null;stopTick();save();ui.exportTxt='';render();}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var f=ACT[t.dataset.act];if(f)f(t.dataset.v,t);
});
document.addEventListener('change',function(e){if(e.target.closest&&e.target.closest('#pform'))onProfile();});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='pq'){ui.pq=e.target.value;var c=$('pchips');if(c)c.innerHTML=chipsHTML();}});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='bg-file'&&e.target.files&&e.target.files[0])loadBg(e.target.files[0]);});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='bg-op'){try{localStorage.setItem('corpolibero.bgop',e.target.value);}catch(x){}applyBg();}});
document.addEventListener('input',function(e){var t=e.target;if(t&&t.id==='ft')ui.txt=t.value;});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='fm'){ui.fmeal=t.value;return;}
  if(t.dataset&&t.dataset.dr!==undefined&&ui.draft){
    var it=ui.draft[+t.dataset.dr],v=parseFloat(String(t.value).replace(',','.')),f=t.dataset.fld;
    if(it){it[f]=isNaN(v)?(f==='k'?'':it[f]):Math.max(0,v);}
    render();
  }
});
document.addEventListener('submit',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var t=e.target;
  if(t&&t.dataset&&t.dataset.enter){e.preventDefault();ACT[t.dataset.enter](t.dataset.v,t);}
});
window.addEventListener('pagehide',function(){stopTick();unwake();});

render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
